services:
  db:
    image: postgres:17
    container_name: plantas-db
    environment:
      POSTGRES_DB: plantas
      POSTGRES_USER: plantas
      POSTGRES_PASSWORD: plantas
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantas"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./api
    container_name: plantas-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/plantas
      SPRING_DATASOURCE_USERNAME: plantas
      SPRING_DATASOURCE_PASSWORD: plantas
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    container_name: plantas-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
